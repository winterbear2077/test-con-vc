<div class="section-header"><clr-icon shape="play" size="20"></clr-icon> Run Test</div>

<div class="card" style="margin-bottom:1rem">
  <div class="card-block">
    <div class="card-text">
      <div class="clr-row clr-align-items-end">
        <div class="clr-col-auto">
          <clr-select-container>
            <label>Probe Mode</label>
            <select clrSelect [(ngModel)]="probeMode">
              <option value="dry-run">dry-run</option>
              <option value="in-guest-ping">in-guest-ping</option>
              <option value="controller-gateway">controller-gateway</option>
            </select>
          </clr-select-container>
        </div>
        <div class="clr-col-auto">
          <clr-input-container>
            <label>Max Retries</label>
            <input clrInput type="number" [(ngModel)]="maxRetries" min="0" max="5" style="width:64px" />
          </clr-input-container>
        </div>
        <div class="clr-col-auto">
          <clr-input-container>
            <label>VMs/Subnet</label>
            <input clrInput type="number" [(ngModel)]="vmsPerSubnet" min="1" max="8" style="width:64px" />
            <clr-control-error *ngIf="intraSubnetWarn">Must be &ge;2 for Intra-Subnet</clr-control-error>
          </clr-input-container>
        </div>
        <div class="clr-col-auto">
          <clr-input-container>
            <label>Max VMs/Phase</label>
            <input clrInput type="number" [(ngModel)]="maxVmsPerPhase" min="2" max="100" style="width:72px" [disabled]="!phasedTesting" />
          </clr-input-container>
        </div>
        <div class="clr-col-auto">
          <clr-select-container>
            <label>Testsuite</label>
            <select clrSelect [(ngModel)]="selectedTestsuite" style="min-width:220px">
              <option value="">Default (All VRF + Custom)</option>
              <option *ngFor="let s of suites" [value]="s.name">{{ s.name }} ({{ (s.testcase_keys || []).length }})</option>
            </select>
          </clr-select-container>
          <!-- <button class="btn btn-sm btn-link" style="margin-top:2px" (click)="refreshSuites()">Refresh</button> -->
        </div>
        <div class="clr-col-lg" *ngIf="phasedTesting">
          <label class="p6" style="font-weight:600;display:block;margin-bottom:4px">Phases</label>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <clr-checkbox-wrapper><input type="checkbox" clrCheckbox [(ngModel)]="phaseIntraSubnet" /><label>Intra-Subnet</label></clr-checkbox-wrapper>
            <clr-checkbox-wrapper><input type="checkbox" clrCheckbox [(ngModel)]="phaseIntraVrf" /><label>Intra-VRF</label></clr-checkbox-wrapper>
            <clr-checkbox-wrapper><input type="checkbox" clrCheckbox [(ngModel)]="phaseCrossVrfAllow" /><label>Cross-VRF Allow</label></clr-checkbox-wrapper>
            <clr-checkbox-wrapper><input type="checkbox" clrCheckbox [(ngModel)]="phaseCrossVrfBlock" /><label>Cross-VRF Block</label></clr-checkbox-wrapper>
          </div>
        </div>
        <div class="clr-col-auto" style="display:flex;flex-direction:column;gap:4px;padding-bottom:8px">
          <clr-toggle-wrapper><input type="checkbox" clrToggle [(ngModel)]="executeVcenter" /><label>Execute vCenter</label></clr-toggle-wrapper>
          <clr-toggle-wrapper><input type="checkbox" clrToggle [(ngModel)]="phasedTesting" /><label>Phased Testing</label></clr-toggle-wrapper>
          <clr-toggle-wrapper><input type="checkbox" clrToggle [(ngModel)]="cleanupOnFailure" /><label>Cleanup on Failure</label></clr-toggle-wrapper>
        </div>
        <div class="clr-col-auto" style="padding-bottom:8px;display:flex;align-items:center;gap:12px">
          <button class="btn btn-success" (click)="startRun()" [disabled]="running || intraSubnetWarn">
            <clr-icon shape="play" size="14"></clr-icon> Start Run
          </button>
          <button class="btn btn-danger-outline btn-sm" (click)="cancelRun()" *ngIf="running">
            <clr-icon shape="stop" size="14"></clr-icon> Cancel
          </button>
          <span *ngIf="indicator==='running'" style="color:#0079b8">
            <clr-spinner clrInline></clr-spinner> Running...
          </span>
          <span *ngIf="indicator==='pass'" class="label label-success">&#x2713; PASS</span>
          <span *ngIf="indicator==='fail'" class="label label-danger">&#x2717; FAIL</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card" style="margin-bottom:1rem">
  <div class="card-header" style="background:#21333b;color:#fff;display:flex;justify-content:space-between;align-items:center">
    <span><clr-icon shape="terminal" size="16"></clr-icon> Output</span>
    <button class="btn btn-icon btn-sm btn-link" (click)="clearLog()" style="color:#aaa">
      <clr-icon shape="trash" size="14"></clr-icon>
    </button>
  </div>
  <div #logEl class="log-area">
    <span *ngFor="let l of logLines" [class]="'log-'+l.cls">{{ l.text }}</span>
  </div>
</div>

<app-result-panel [result]="result"></app-result-panel>
