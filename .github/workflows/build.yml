name: Build Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"          # trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  build_iso:
    runs-on: ubuntu-22.04
    name: Build nettest ISO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build nettest-mini.iso
        run: |
          set -euo pipefail
          sh ovf/build_mini_iso.sh ovf/nettest-mini.iso --skip-probe-build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nettest-mini-iso
          path: ovf/nettest-mini.iso

  build:
    needs: build_iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14       # Apple Silicon (arm64)
            label: macos-arm64
            asset: vcnet-test-macos-arm64.tar.gz

          - os: windows-latest
            label: windows-x64
            asset: vcnet-test-windows-x64.zip

          - os: ubuntu-22.04
            label: linux-x86_64
            asset: vcnet-test-linux-x86_64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: nettest-mini-iso
          path: ovf

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # uvloop is not available on Windows — skip it there
      - name: Install uvloop (non-Windows)
        if: runner.os != 'Windows'
        run: pip install uvloop

      - name: Build with PyInstaller
        run: pyinstaller vcnet-test.spec --clean

      - name: Prepare bundle layout (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ISO_SRC="ovf/nettest-mini.iso"
          if [ ! -f "$ISO_SRC" ]; then
            echo "ERROR: required ISO missing: $ISO_SRC"
            exit 1
          fi

          rm -rf bundle
          mkdir -p bundle/vcnet-test/ovf
          cp -R dist/vcnet-test/. bundle/vcnet-test/
          cp "$ISO_SRC" bundle/vcnet-test/ovf/

      - name: Prepare bundle layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $isoSrc = "ovf/nettest-mini.iso"
          if (!(Test-Path $isoSrc)) {
            throw "required ISO missing: $isoSrc"
          }

          if (Test-Path bundle) {
            Remove-Item -Recurse -Force bundle
          }

          New-Item -ItemType Directory -Path bundle\vcnet-test\ovf | Out-Null
          Copy-Item -Recurse dist\vcnet-test\* bundle\vcnet-test\
          Copy-Item $isoSrc bundle\vcnet-test\ovf\

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd bundle
          tar -czf ../${{ matrix.asset }} vcnet-test/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path bundle\vcnet-test -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-22.04
    # Only create a release when triggered by a version tag
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
